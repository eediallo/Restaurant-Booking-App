name: Run All Tests

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Run frontend tests
        run: ./tools/run_unit_tests.sh

      - name: Build frontend
        run: npm run build
        working-directory: web

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest tests/ --tb=short

  all-tests-passed:
    if: always()
    needs: [frontend-tests, backend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job to pass
        env:
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          PYTHON_RESULT: ${{ needs.backend-tests.result }}
        run: |
          if [[ "$FRONTEND_RESULT" != "success" || "$PYTHON_RESULT" != "success" ]]; then
            echo "Frontend tests/build: $FRONTEND_RESULT"
            echo "Backend tests: $PYTHON_RESULT"
            exit 1
          fi
